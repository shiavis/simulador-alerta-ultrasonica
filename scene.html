<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
:root{--ink:#0b1518;--panel:#18272a;--paper:#f0f0e6;--muted:#a6b4b0;--teal:#2dd4bf;--amber:#ffb300;--red:#ef5350;--orange:#ff7b31}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:Arial,sans-serif}.wrap{border:1px solid rgba(213,226,220,.18);background:linear-gradient(140deg,#304044,#18272a);padding:13px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 5px 12px}.title{color:var(--amber);font:800 10px Arial;letter-spacing:.14em}.readout{color:var(--muted);font:800 10px Arial;letter-spacing:.12em}.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#738482;margin-right:7px}.running .live{background:var(--teal);box-shadow:0 0 0 4px rgba(45,212,191,.13)}svg{display:block;width:100%;height:auto;border:1px solid rgba(213,226,220,.14);background:#122023}.svg-label{fill:#ffe082;font-size:11px;font-weight:800;letter-spacing:1.3px}.svg-micro{fill:#98aba8;font-size:9px;letter-spacing:1px}.distance-label{fill:#ffe082;font-size:11px;font-weight:800;letter-spacing:.8px}.svg-signal-state{fill:#a6b4b0;font-size:10px;font-weight:800;letter-spacing:2px}.pulse{opacity:.08}.running .pulse{opacity:1}.pulse-outgoing{animation:send 2.8s linear infinite}.pulse-return{animation:receive 2.8s linear 1.4s infinite}@keyframes send{0%{opacity:0}10%,45%{opacity:1}50%,100%{opacity:0}}@keyframes receive{0%,48%{opacity:0}58%,90%{opacity:1}100%{opacity:0}}.controls{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding-top:11px}.controls button{min-height:34px;padding:0 12px;border:1px solid rgba(213,226,220,.22);color:var(--paper);background:#263238;font:800 10px Arial;letter-spacing:.08em;cursor:pointer}.controls button:first-child{color:#18272a;background:var(--amber);border-color:var(--amber)}.controls button:hover{filter:brightness(1.1)}input[type=range]{width:100%;accent-color:var(--teal)}.mini{display:flex;justify-content:space-between;color:var(--muted);font:10px Arial;margin-top:5px}.telemetry{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(213,226,220,.16);margin-top:11px}.metric{padding:9px;background:rgba(11,21,24,.48)}.metric span{display:block;color:var(--muted);font:800 8px Arial;letter-spacing:.1em}.metric b{display:block;color:var(--paper);font:800 21px Arial;margin-top:5px}.metric small{color:#738482;font:9px Arial}.status{margin-top:8px;padding:9px;border-left:3px solid var(--teal);background:rgba(45,212,191,.08);color:var(--teal);font:800 11px Arial;letter-spacing:.1em}.status.caution{border-color:var(--amber);color:var(--amber);background:rgba(255,179,0,.08)}.status.alert{border-color:var(--orange);color:var(--orange);background:rgba(255,123,49,.08)}.status.emergency{border-color:var(--red);color:var(--red);background:rgba(239,83,80,.11)}@media(max-width:620px){.controls{grid-template-columns:1fr 1fr}.controls label{grid-column:1/-1}.telemetry{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="bar"><span class="title">02 / ESCENA DEL CANAL · PULSO Y ECO</span><span class="readout"><i class="live"></i><span id="runState">EN ESPERA</span></span></div>
<svg id="scene" viewBox="0 0 800 360" role="img" aria-label="Canal pluvial con sensor ultrasónico">
<defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1f3034"/><stop offset="1" stop-color="#0f1c20"/></linearGradient><linearGradient id="water" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1bc4b2" stop-opacity=".9"/><stop offset="1" stop-color="#087f83" stop-opacity=".72"/></linearGradient><filter id="tealGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="amberGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="clip"><rect x="31" y="70" width="738" height="220" rx="8"/></clipPath></defs>
<rect width="800" height="360" fill="url(#sky)"/><g opacity=".18" stroke="#9fb5b5"><path d="M30 110H770M30 150H770M30 190H770M30 230H770M30 270H770"/><path d="M110 70V290M190 70V290M270 70V290M350 70V290M430 70V290M510 70V290M590 70V290M670 70V290"/></g><g id="rainLines" opacity=".5" stroke="#b6e8e5" stroke-width="1.4"><path d="M84 14l-12 24M140 25l-12 24M206 10l-12 24M270 30l-12 24M334 12l-12 24M462 22l-12 24M534 8l-12 24M612 25l-12 24M700 12l-12 24"/></g>
<path d="M30 76H770V289H30Z" fill="none" stroke="#7c8a8b" stroke-width="2"/><path d="M30 76H180L230 115H570L620 76H770V289H30Z" fill="#36454a" opacity=".55"/><path d="M30 278L230 115H570L770 278V289H30Z" fill="#1a2528"/><path d="M30 278L230 115M770 278L570 115M230 115H570" fill="none" stroke="#9aacab" stroke-width="2" opacity=".7"/>
<g clip-path="url(#clip)"><path id="waterFill" fill="url(#water)"/><path id="waterSurface" fill="none" stroke="#b2fff2" stroke-width="3" filter="url(#tealGlow)"/><path id="waterSurfaceSoft" fill="none" stroke="#39ddcb" stroke-width="1" opacity=".6"/></g>
<g><rect x="372" y="16" width="56" height="12" rx="3" fill="#ffb300"/><rect x="392" y="27" width="16" height="40" rx="3" fill="#d9e1dd"/><rect x="385" y="61" width="30" height="18" rx="5" fill="#ffb300"/><circle cx="400" cy="80" r="8" fill="#263238" stroke="#ffe082" stroke-width="3"/><text x="450" y="42" class="svg-label">SENSOR US-01</text><text x="450" y="58" class="svg-micro">emisión / recepción</text></g>
<g><path id="distanceLine" stroke="#ffb300" stroke-dasharray="4 5" stroke-width="1.5" opacity=".85"/><path id="distanceTicks" stroke="#ffb300" stroke-width="1.5"/><rect id="distanceLabelBg" width="112" height="28" rx="4" fill="#18272a" stroke="#ffb300"/><text id="distanceLabel" text-anchor="middle" class="distance-label"/></g>
<g id="outgoingPulse" class="pulse pulse-outgoing" filter="url(#amberGlow)"><path id="outgoingWave" stroke="#ffe082" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M392 99l8-14 8 14M392 205l8 14 8-14" fill="none" stroke="#ffe082" stroke-width="2"/></g><g id="returnPulse" class="pulse pulse-return" filter="url(#tealGlow)"><path id="returnWave" stroke="#7cfff1" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><path d="M392 205l8 14 8-14M392 99l8-14 8 14" fill="none" stroke="#7cfff1" stroke-width="2"/></g>
<g><path d="M48 112h16M48 170h16M48 228h16" stroke="#b9ccca"/><text x="72" y="116" class="svg-micro">2.2 m</text><text x="72" y="174" class="svg-micro">1.5 m</text><text x="72" y="232" class="svg-micro">0.8 m</text><text x="47" y="313" class="svg-micro">FONDO DEL CANAL</text></g><text id="signalState" x="400" y="330" text-anchor="middle" class="svg-signal-state">PULSO EN ESPERA</text></svg>
<div class="controls"><label><input id="rain" type="range" min="0" max="100" value="__RAIN__"/><span class="mini"><span>lluvia</span><b id="rainText">__RAIN__%</b></span></label><button id="run">▶ INICIAR</button><button id="reset">↻ REINICIAR</button></div><div class="telemetry"><div class="metric"><span>NIVEL</span><b id="levelText">0.72</b><small>m</small></div><div class="metric"><span>DISTANCIA d</span><b id="distanceText">1.78</b><small>m</small></div><div class="metric"><span>TIEMPO t</span><b id="tofText">10.38</b><small>ms</small></div><div class="metric"><span>ESTADO</span><b id="statusText">NORMAL</b><small id="speedText">343 m/s</small></div></div><div class="status" id="statusBox">✓ MONITOREO NORMAL · la lectura continúa</div></div>
<script>
const $=id=>document.getElementById(id), app=$("app");let level=__LEVEL__,rain=__RAIN__,height=__HEIGHT__,temp=__TEMP__,speed=__SPEED__,caution=__CAUTION__,alertT=__ALERT__,emergency=__EMERGENCY__,running=false,timer=null,sim=0,last=performance.now();const MAX=2.2;
function fmt(v,n=2){return Number(v).toFixed(n)}function status(){return level>=emergency?["EMERGENCIA","emergency","!","posible desbordamiento"]:level>=alertT?["ALERTA","alert","!","preparar respuesta"]:level>=caution?["PRECAUCIÓN","caution","•","revisar condiciones"]:["NORMAL","","✓","la lectura continúa"]}
function paint(){const d=Math.max(.05,height-level),tof=2*d/speed,s=status(),wy=282-(level/MAX)*170,w=`M0 ${wy} Q80 ${wy-6} 160 ${wy} T320 ${wy} T480 ${wy} T640 ${wy} T800 ${wy}`;$("waterSurface").setAttribute("d",w);$("waterSurfaceSoft").setAttribute("d",w.replaceAll(wy,wy+6));$("waterFill").setAttribute("d",w+" L800 360 L0 360Z");$("distanceLine").setAttribute("d",`M430 80V${wy}`);$("distanceTicks").setAttribute("d",`M425 80H435M425 ${wy}H435`);let ly=80+(wy-80)/2-14;$("distanceLabelBg").setAttribute("x",442);$("distanceLabelBg").setAttribute("y",ly);$("distanceLabel").setAttribute("x",498);$("distanceLabel").setAttribute("y",ly+19);$("distanceLabel").textContent=`d = ${fmt(d)} m`;$("outgoingWave").setAttribute("d",`M400 84V${wy-7}`);$("returnWave").setAttribute("d",`M400 ${wy-7}V84`);$("rainLines").setAttribute("opacity",rain>5?.18+rain/180:0);$("levelText").textContent=fmt(level);$("distanceText").textContent=fmt(d);$("tofText").textContent=fmt(tof*1000);$("speedText").textContent=`${fmt(speed,1)} m/s`;$("rainText").textContent=`${Math.round(rain)}%`;$("statusText").textContent=s[0];$("statusBox").textContent=`${s[2]} ${s[0]} · ${s[3]}`;$("statusBox").className=`status ${s[1]}`;$("signalState").textContent=running?"PULSO / ECO EN CICLO":"PULSO EN ESPERA";$("runState").textContent=running?"MUESTREO ACTIVO":"EN ESPERA";app.classList.toggle("running",running)}
function tick(){let now=performance.now(),dt=Math.min(.5,(now-last)/1000);last=now;let virtual=dt*18;level=Math.max(.12,Math.min(MAX-.03,level+((rain/100)*.00065-(.00028+level*.00004))*virtual));sim+=virtual;paint()}$("rain").addEventListener("input",e=>{rain=+e.target.value;paint()});$("run").addEventListener("click",()=>{running=!running;$("run").textContent=running?"Ⅱ PAUSAR":"▶ INICIAR";if(running){last=performance.now();timer=setInterval(tick,100)}else{clearInterval(timer);timer=null}paint()});$("reset").addEventListener("click",()=>{level=__LEVEL__;rain=__RAIN__;$("rain").value=rain;running=false;clearInterval(timer);timer=null;paint()});paint();
</script></body></html>
